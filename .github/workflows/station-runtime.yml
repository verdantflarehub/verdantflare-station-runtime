name: Station Runtime

env:
  REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
  IMAGE_NAME: wod/verdantflare-station
  IMAGE_VERSION: station-runtime-v0.2.22

on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: station-runtime-release
  cancel-in-progress: false

jobs:
  image:
    name: Build image and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Configure release destination
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${REGISTRY_ENDPOINT%/}"
          [[ "$endpoint" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?$ ]] || { echo 'Invalid or missing registry endpoint'; exit 1; }
          [[ "$IMAGE_NAME" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]] || { echo 'Invalid image repository'; exit 1; }
          [[ "$IMAGE_VERSION" =~ ^station-runtime-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid image version'; exit 1; }
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
          echo "image=$endpoint/$IMAGE_NAME" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}
      - name: Refuse an existing release tag
        env:
          IMAGE: ${{ steps.registry.outputs.image }}:${{ env.IMAGE_VERSION }}
        run: bash scripts/check-image-absent.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build controlled release CLI
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p dist/preinstalled-release
          GOOS=linux go build -trimpath -ldflags="-s -w" -o dist/preinstalled-release/preinstalled-release-linux-amd64 ./cmd/preinstalled-release
          GOOS=windows go build -trimpath -ldflags="-s -w" -o dist/preinstalled-release/preinstalled-release-windows-amd64.exe ./cmd/preinstalled-release
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg revision "$GITHUB_SHA" --arg ref "$GITHUB_REF" --arg version "$IMAGE_VERSION" --arg runId "$GITHUB_RUN_ID" --arg runAttempt "$GITHUB_RUN_ATTEMPT" --arg goVersion "$(go env GOVERSION)" \
            '{schemaVersion:1,repository:$repository,revision:$revision,ref:$ref,version:$version,runId:$runId,runAttempt:$runAttempt,goVersion:$goVersion}' > dist/preinstalled-release/source.json
          cd dist/preinstalled-release
          sha256sum preinstalled-release-linux-amd64 preinstalled-release-windows-amd64.exe source.json > SHA256SUMS
      - name: Publish versioned release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.registry.outputs.image }}:${{ env.IMAGE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      - name: Deliver controlled release CLI
        uses: actions/upload-artifact@v4
        with:
          name: preinstalled-release-${{ env.IMAGE_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/preinstalled-release/
          if-no-files-found: error
          retention-days: 90
