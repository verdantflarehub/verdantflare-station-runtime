apiVersion: v1
kind: Service
metadata:
  name: dcgm-exporter
  namespace: verdantflare-station
  labels:
    app.kubernetes.io/name: dcgm-exporter
    app.kubernetes.io/part-of: verdantflare
    app.kubernetes.io/component: hardware-telemetry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dcgm-exporter
  ports:
    - name: metrics
      port: 9400
      targetPort: 9400
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: verdantflare-station
  labels:
    app.kubernetes.io/name: dcgm-exporter
    app.kubernetes.io/part-of: verdantflare
    app.kubernetes.io/component: hardware-telemetry
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dcgm-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcgm-exporter
        app.kubernetes.io/part-of: verdantflare
        app.kubernetes.io/component: hardware-telemetry
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.8-3.6.0-ubuntu22.04
          imagePullPolicy: IfNotPresent
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
            - name: DCGM_EXPORTER_LISTEN
              value: ":9400"
            - name: DCGM_EXPORTER_KUBERNETES
              value: "true"
          ports:
            - name: metrics
              containerPort: 9400
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
          resources:
            limits:
              cpu: 1000m
              memory: 1024Mi
            requests:
              cpu: 100m
              memory: 256Mi
