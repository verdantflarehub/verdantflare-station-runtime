apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: verdantflare-station
  labels:
    app.kubernetes.io/name: coturn
    app.kubernetes.io/part-of: verdantflare
    app.kubernetes.io/component: media-relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: coturn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coturn
        app.kubernetes.io/part-of: verdantflare
        app.kubernetes.io/component: media-relay
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coturn
          image: registry.cn-qingdao.aliyuncs.com/wod/coturn:4.6.2-alpine
          imagePullPolicy: Always
          command: [turnserver]
          args:
            - -c
            - /etc/coturn-auth/auth.conf
            - --realm=station.internal
            - --fingerprint
            - --use-auth-secret
            - --listening-ip=$(POD_IP)
            - --relay-ip=$(POD_IP)
            - --listening-port=3478
            - --min-port=49160
            - --max-port=49259
            # Both endpoints must allocate on this relay. An allow rule alone
            # is not a whitelist in coturn; explicit deny-all is required.
            - --denied-peer-ip=0.0.0.0-255.255.255.255
            - --denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
            - --allowed-peer-ip=$(POD_IP)
            - --no-multicast-peers
            - --no-tcp-relay
            - --no-cli
            - --no-tls
            - --no-dtls
            - --stale-nonce=600
            - --user-quota=4
            - --total-quota=16
            - --max-bps=5000000
            - --bps-capacity=20000000
            - --log-file=stdout
            - --simple-log
            - --pidfile=/tmp/turnserver.pid
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - {name: turn-udp, containerPort: 3478, protocol: UDP}
            - {name: turn-tcp, containerPort: 3478, protocol: TCP}
          startupProbe:
            tcpSocket: {port: turn-tcp}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: turn-tcp}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: turn-tcp}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # Upstream turnserver carries this file capability; it must be
              # in the bounding set even when listening on port 3478.
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - {name: auth, mountPath: /etc/coturn-auth, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: auth
          secret:
            secretName: coturn-auth
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
